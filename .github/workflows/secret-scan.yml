# .github/workflows/secret-scan.yml
#
# Scan every PR for secret-shaped strings in the diff using gitleaks.
# See scripts/secret-scan-staged.sh for the local-side pre-commit
# counterpart and the allowlist convention (`# gitleaks:allow`).
#
# Why gitleaks and not just the bash script:
#   - Entropy-based detection catches values that don't match a known
#     prefix but look like high-randomness strings.
#   - Allowlist via .gitleaks.toml is shared between local and CI.
#   - The same tool runs in both places, so a CI pass implies a local
#     pass for the same diff (modulo env-specific rules).

name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks
        run: |
          GL_VERSION="8.21.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --report-path gitleaks-report.json \
            --no-banner \
            --exit-code 1 || {
              echo "::error::gitleaks found secret-shaped strings. See gitleaks-report.json." >&2
              cat gitleaks-report.json >&2
              exit 1
            }

      - name: Scan whole tree on push to main
        if: github.event_name == 'push'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --report-path gitleaks-report.json \
            --no-banner \
            --exit-code 1 || {
              echo "::error::gitleaks found secret-shaped strings on main. See gitleaks-report.json." >&2
              cat gitleaks-report.json >&2
              exit 1
            }